<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LuaLex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>LuaLex</h1>

    <p>Diccionario de Lua explicado en lenguaje humano.</p>

    <h2>Condicionales</h2>

    <h3>if</h3>
    <p><b>Humano:</b> si</p>
    <p><b>Ejemplo:</b> if x &gt; 5 then</p>

    <h3>then</h3>
    <p><b>Humano:</b> entonces</p>
    <p><b>Ejemplo:</b> if x &gt; 5 then</p>

    <h3>else</h3>
    <p><b>Humano:</b> si no</p>
    <p><b>Ejemplo:</b> else</p>

</body>

</html>
